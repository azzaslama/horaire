<div id="controls"><button onclick="testSound()">تجربة الصوت</button><button onclick="startScreen()">تشغيل الشاشة والصوت</button><div id="status"></div></div>
<script>
var lessons=[
{name:"الحصة الأولى",start:"07:15",end:"08:00"},
{name:"الحصة الثانية",start:"08:00",end:"08:45"},
{name:"الفسحة",start:"08:45",end:"09:00"},
{name:"الحصة الثالثة",start:"09:00",end:"09:45"},
{name:"الحصة الرابعة",start:"09:45",end:"10:30"},
{name:"الحصة الخامسة",start:"10:30",end:"11:15"},
{name:"الحصة السادسة",start:"11:15",end:"12:00"},
{name:"الحصة الأولى",start:"13:30",end:"14:15"},
{name:"الحصة الثانية",start:"14:15",end:"15:00"},
{name:"الحصة الثالثة",start:"15:00",end:"15:45"},
{name:"الفسحة",start:"15:45",end:"16:00"},
{name:"الحصة الرابعة",start:"16:00",end:"16:45"},
{name:"الحصة الخامسة",start:"16:45",end:"17:30"},
{name:"الحصة السادسة",start:"17:30",end:"18:15"}
];
var soundEnabled=false,announced={},arabicVoice=null;
function toMinutes(time){var parts=time.split(":");return Number(parts[0])*60+Number(parts[1]);}
function loadVoices(){
 arabicVoice=null;
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){document.getElementById("status").textContent="هذا المتصفح لا يدعم النطق. جرّبي متصفحًا آخر.";return;}
 var voices=window.speechSynthesis.getVoices();
 for(var i=0;i<voices.length;i++){if(/^ar([-_]|$)/i.test(voices[i].lang)){arabicVoice=voices[i];if(voices[i].localService){break;}}}
 document.getElementById("status").textContent=arabicVoice?"الصوت العربي جاهز: "+arabicVoice.name:"لم يظهر صوت عربي. جرّبي تجربة الصوت؛ إذا بقي صامتًا يلزم تفعيل صوت عربي في الجهاز أو استعمال متصفح آخر.";
}
function speak(text){
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){return;}
 window.speechSynthesis.cancel();
 var message=new SpeechSynthesisUtterance(text);if(arabicVoice){message.voice=arabicVoice;}message.lang=arabicVoice?arabicVoice.lang:"ar-SA";message.rate=.85;message.volume=1;
 message.onerror=function(event){if(event.error==="canceled"||event.error==="interrupted"){return;}document.getElementById("controls").style.display="block";document.getElementById("status").textContent="تعذّر تشغيل الصوت. جرّبي زر تجربة الصوت مجددًا.";};
 window.speechSynthesis.speak(message);
}
function testSound(){
 loadVoices();
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){return;}
 speak(document.getElementById("lesson").textContent || "تجربة الصوت");
}
function pad(number){return number<10?"0"+number:String(number);}
function updateScreen(){
 var qatar=new Date(Date.now()+3*60*60*1000);
 var seconds=qatar.getUTCSeconds(),minutes=qatar.getUTCMinutes(),hour=qatar.getUTCHours()%12;
 document.getElementById("hourHand").setAttribute("transform","rotate("+(hour*30+minutes*.5+seconds/120)+" 150 150)");
 document.getElementById("minuteHand").setAttribute("transform","rotate("+(minutes*6+seconds*.1)+" 150 150)");
 document.getElementById("secondHand").setAttribute("transform","rotate("+(seconds*6)+" 150 150)");
 document.getElementById("clock").setAttribute("aria-label","توقيت قطر "+pad(qatar.getUTCHours())+":"+pad(minutes)+":"+pad(seconds));
 var now=qatar.getUTCHours()*60+qatar.getUTCMinutes();
 var title="انتهت الحصص",hours="18:15",currentLesson=null;
 if(now<toMinutes("07:15")){title="لم تبدأ الحصص";hours="07:15";}else if(now>=toMinutes("12:00")&&now<toMinutes("13:30")){title="انتهت حصص الصباح";hours="12:00";}
 for(var i=0;i<lessons.length;i++){var lesson=lessons[i];if(now>=toMinutes(lesson.start)&&now<toMinutes(lesson.end)){currentLesson=lesson;title=lesson.name;hours=lesson.start+" – "+lesson.end;break;}}
 document.getElementById("lesson").textContent=title;document.getElementById("time").textContent=hours;
 if(soundEnabled&&currentLesson&&("speechSynthesis" in window)){var day=qatar.getUTCFullYear()+"-"+qatar.getUTCMonth()+"-"+qatar.getUTCDate();var key=day+"-"+currentLesson.start;if(!announced[key]){announced[key]=true;speak(currentLesson.name);}}
}
function screenFallback(){
 document.getElementById("controls").style.display="block";
 document.getElementById("status").textContent="التكبير التلقائي غير متاح هنا. على Windows اضغطي F11، أو من قائمة المتصفح اختاري ملء الشاشة.";
}
function startScreen(){
 // طلب ملء الشاشة مباشرة عند الضغط، قبل إعداد الصوت.
 var page=document.documentElement;
 var full=page.requestFullscreen||page.msRequestFullscreen||page.webkitRequestFullscreen;
 if(full){
  try{
   var result=full.call(page);
   if(result&&result.catch){result.catch(screenFallback);}
  }catch(error){screenFallback();}
 }else{screenFallback();}
 loadVoices();
 soundEnabled=true;
 updateScreen();
 if(arabicVoice){
  document.getElementById("controls").style.display="none";
 }else{
  document.getElementById("controls").style.display="block";
 }
}
document.addEventListener("fullscreenchange",function(){
 if(!document.fullscreenElement){document.getElementById("controls").style.display="block";}
});
document.ondblclick=function(){document.getElementById("controls").style.display="block";};
document.addEventListener("visibilitychange",function(){if(!document.hidden){updateScreen();}});
if("speechSynthesis" in window){window.speechSynthesis.onvoiceschanged=loadVoices;
 setTimeout(loadVoices,500);setTimeout(loadVoices,1500);setTimeout(loadVoices,3000);}
loadVoices();updateScreen();setInterval(updateScreen,1000);
</script>
